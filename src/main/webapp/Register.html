<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · SwiftByte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Warm sunset — appetite / craving palette */
      --brand-red: #ff3d68;
      --brand-orange: #ff8a3d;
      --brand-amber: #ffd28a;
      --brand-red-deep: #d91a4a;
      --gradient-brand: linear-gradient(135deg, #ff3d68 0%, #ff8a3d 100%);
      --gradient-bg: linear-gradient(135deg, #ff3d68 0%, #ff7a45 40%, #ffaa5c 70%, #ffd28a 100%);

      --card: #ffffff;
      --text: #2b1a1a;
      --muted: #9a8a82;
      --input-bg: #fff8f4;
      --input-line: #f3ddd2;
      --shadow-card: 0 30px 80px rgba(255, 61, 104, 0.26), 0 10px 30px rgba(0, 0, 0, 0.08);
      --shadow-btn: 0 12px 28px rgba(255, 61, 104, 0.42);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-bg);
      padding: 24px;
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    /* soft ambient blobs */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 420px; height: 420px;
      background: #ff3d68;
      top: -120px; left: -120px;
    }
    body::after {
      width: 480px; height: 480px;
      background: #ffd28a;
      bottom: -160px; right: -140px;
    }

    .register-card {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      max-width: 1080px;
      min-height: 760px;
      background: var(--card);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      animation: rise 0.7s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ---------- Left visual ---------- */
    .visual {
      position: relative;
      flex: 1.05;
      min-width: 320px;
      background: url('https://images.unsplash.com/photo-1565299624946-b28f40a3ae07?ixlib=rb-4.0.3&auto=format&fit=crop&w=900&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 36px;
      color: #fff;
    }
    .visual::before {
      content: '';
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%),
        linear-gradient(135deg, rgba(255, 61, 104, 0.55), rgba(255, 138, 61, 0.35));
    }

    .brand {
      position: relative; z-index: 1;
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 1.15rem; letter-spacing: 0.2px;
    }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--gradient-brand);
      display: grid; place-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .brand-mark svg { width: 18px; height: 18px; }

    .visual-content { position: relative; z-index: 1; }
    .visual-content h2 {
      font-size: 2.1rem; font-weight: 700; line-height: 1.15; margin-bottom: 10px;
    }
    .visual-content p {
      font-size: 0.95rem; font-weight: 300; line-height: 1.55;
      opacity: 0.92; max-width: 320px;
    }
    .dots { display: flex; gap: 8px; margin-top: 22px; }
    .dot {
      width: 22px; height: 6px; border-radius: 999px;
      background: rgba(255,255,255,0.4);
      transition: background .3s, width .3s;
    }
    .dot.active { background: #fff; width: 30px; }

    /* ---------- Right form ---------- */
    .form-section {
      flex: 1;
      min-width: 320px;
      padding: 44px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
      max-height: 92vh;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.72rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--brand-red);
      margin-bottom: 10px;
    }
    .form-section h1 {
      font-size: 1.9rem; font-weight: 700; margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.92rem; color: var(--muted); margin-bottom: 22px;
    }

    .field { margin-bottom: 14px; }
    .field label,
    .address-block > label {
      display: block; font-size: 0.78rem; font-weight: 500;
      color: #52525b; margin-bottom: 7px;
    }
    .input-wrap {
      position: relative;
      display: flex; align-items: center;
      background: var(--input-bg);
      border: 1.5px solid var(--input-line);
      border-radius: 12px;
      padding: 4px 14px;
      transition: border-color .25s, background .25s, box-shadow .25s;
    }
    .input-wrap:focus-within {
      border-color: var(--brand-red);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 90, 78, 0.12);
    }
    .input-wrap svg {
      width: 18px; height: 18px; color: var(--muted); flex-shrink: 0;
    }
    .input-wrap input,
    .input-wrap select {
      width: 100%;
      border: none; background: transparent;
      padding: 12px 10px;
      font-size: 0.95rem; font-family: inherit; color: var(--text);
      outline: none;
    }
    .input-wrap select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .input-wrap input::placeholder,
    .input-wrap select:invalid { color: #b6b6bf; }
    .toggle-pass {
      background: none; border: none; cursor: pointer;
      color: var(--muted); display: grid; place-items: center;
      padding: 4px; border-radius: 6px;
    }
    .toggle-pass:hover { color: var(--brand-red); }

    /* Address block */
    .address-block { margin-bottom: 14px; }
    .address-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem; font-weight: 600; color: var(--text);
      margin-bottom: 12px;
    }
    .address-title svg { width: 18px; height: 18px; color: var(--brand-red); }
    .address-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .address-grid .field { margin-bottom: 0; }
    .address-grid .field.full { grid-column: 1 / -1; }

    .terms {
      display: flex; align-items: flex-start; gap: 10px;
      margin: 4px 0 20px; font-size: 0.82rem; color: #52525b; line-height: 1.45;
    }
    .terms input {
      width: 16px; height: 16px; accent-color: var(--brand-red); cursor: pointer;
      margin-top: 2px; flex-shrink: 0;
    }
    .terms a { color: var(--brand-red); text-decoration: none; font-weight: 600; }
    .terms a:hover { text-decoration: underline; }

    .btn-register {
      width: 100%;
      padding: 15px;
      border: none; border-radius: 12px;
      background: var(--gradient-brand);
      color: #fff;
      font-size: 1rem; font-weight: 600; font-family: inherit;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: transform .18s ease, box-shadow .25s ease, filter .25s ease;
      letter-spacing: 0.2px;
    }
    .btn-register:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(255,90,78,0.5); filter: brightness(1.03); }
    .btn-register:active { transform: translateY(0); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0 14px;
      color: var(--muted); font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--input-line);
    }

    .socials { display: flex; gap: 10px; }
    .social-btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px; border-radius: 12px;
      border: 1.5px solid var(--input-line); background: #fff;
      cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 500;
      color: #3f3f46;
      transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .social-btn:hover {
      border-color: var(--brand-red);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 90, 78, 0.12);
    }
    .social-btn svg { width: 18px; height: 18px; }

    .signin {
      text-align: center; margin-top: 20px;
      font-size: 0.9rem; color: var(--muted);
    }
    .signin a { color: var(--brand-red); text-decoration: none; font-weight: 600; }
    .signin a:hover { text-decoration: underline; }

    @media (max-width: 900px) {
      .register-card { flex-direction: column; max-width: 480px; min-height: unset; }
      .visual { min-height: 180px; padding: 24px; }
      .visual-content h2 { font-size: 1.5rem; }
      .form-section { padding: 30px 26px; max-height: unset; }
    }

    @media (max-width: 420px) {
      .address-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="register-card">
    <!-- Left: brand + food visual -->
    <section class="visual" aria-label="SwiftByte promo">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" fill="#fff"/>
          </svg>
        </span>
        SwiftByte
      </div>

      <div class="visual-content">
        <h2>Craving something delicious?</h2>
        <p>Join SwiftByte and get your favorite meals delivered fast from top restaurants near you.</p>
        <div class="dots" aria-hidden="true">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </section>

    <!-- Right: register form -->
    <section class="form-section">
      <span class="eyebrow">Start your journey</span>
      <h1>Create your account</h1>
      <p class="subtitle">Hungry? Let's get you ordering in seconds.</p>

      <form action="#" method="POST" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="name" type="text" name="name" placeholder="John Doe" required autocomplete="name" />
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m4 6 8 7 8-7"/></svg>
            <input id="email" type="email" name="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <input id="phone" type="tel" name="phone" placeholder="+1 234 567 890" required autocomplete="tel" />
          </div>
        </div>

        <div class="address-block">
          <div class="address-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Delivery address
          </div>
          <div class="address-grid">
            <div class="field full">
              <label for="street">Street address</label>
              <div class="input-wrap">
                <input id="street" type="text" name="address[street]" placeholder="123 Main Street, Apt 4B" required autocomplete="street-address" />
              </div>
            </div>
            <div class="field">
              <label for="city">City</label>
              <div class="input-wrap">
                <input id="city" type="text" name="address[city]" placeholder="New York" required autocomplete="address-level2" />
              </div>
            </div>
            <div class="field">
              <label for="state">State / Province</label>
              <div class="input-wrap">
                <input id="state" type="text" name="address[state]" placeholder="NY" required autocomplete="address-level1" />
              </div>
            </div>
            <div class="field">
              <label for="zip">ZIP / Postal code</label>
              <div class="input-wrap">
                <input id="zip" type="text" name="address[zip]" placeholder="10001" required autocomplete="postal-code" />
              </div>
            </div>
            <div class="field">
              <label for="country">Country</label>
              <div class="input-wrap">
                <select id="country" name="address[country]" required autocomplete="country-name">
                  <option value="" disabled selected hidden>Select country</option>
                  <option value="US">United States</option>
                  <option value="CA">Canada</option>
                  <option value="UK">United Kingdom</option>
                  <option value="AU">Australia</option>
                  <option value="IN">India</option>
                  <option value="DE">Germany</option>
                  <option value="FR">France</option>
                  <option value="JP">Japan</option>
                  <option value="BR">Brazil</option>
                  <option value="MX">Mexico</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 1 1 8 0v4"/></svg>
            <input id="password" type="password" name="password" placeholder="••••••••" required autocomplete="new-password" minlength="8" />
            <button type="button" class="toggle-pass" aria-label="Show password" onclick="togglePass(this, 'password')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 1 1 8 0v4"/></svg>
            <input id="confirm-password" type="password" name="confirm-password" placeholder="••••••••" required autocomplete="new-password" />
            <button type="button" class="toggle-pass" aria-label="Show confirm password" onclick="togglePass(this, 'confirm-password')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <label class="terms">
          <input type="checkbox" name="terms" required />
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
        </label>

        <button type="submit" class="btn-register">Create Account</button>

        <div class="divider">or sign up with</div>

        <div class="socials">
          <button type="button" class="social-btn" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.9 3.4 14.7 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12S6.7 21.6 12 21.6c6.9 0 11.5-4.8 11.5-11.6 0-.8-.1-1.4-.2-1.9H12z"/></svg>
            Google
          </button>
          <button type="button" class="social-btn" aria-label="Continue with Apple">
            <svg viewBox="0 0 24 24" fill="#000"><path d="M16.4 12.7c0-2.4 2-3.6 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.6.9-.8 0-1.9-.9-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.1.8c1.3 0 2.1-1.2 2.9-2.4.9-1.3 1.3-2.7 1.3-2.7-.1 0-2.6-1-2.6-3.9zM14.1 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.5-.6.7-1.2 1.9-1 2.9 1.1.1 2.2-.6 2.8-1.4z"/></svg>
            Apple
          </button>
        </div>
      </form>

      <p class="signin">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </section>
  </main>

  <script>
    function togglePass(btn, targetId) {
      const input = document.getElementById(targetId);
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      btn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
    }

    // Simple password match check
    document.querySelector('form').addEventListener('submit', function(e) {
      const pwd = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      if (pwd !== confirm) {
        e.preventDefault();
        alert('Passwords do not match. Please try again.');
        document.getElementById('confirm-password').focus();
      }
    });
  </script>
</body>
</html>
