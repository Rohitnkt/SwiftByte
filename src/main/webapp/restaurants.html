      :root {
        --primary: #ff4d4d;
        --primary-dark: #e63e3e;
        --secondary: #ff8a5c;
        --accent: #ffb800;
        --bg: #f5f3f0;
        --bg-soft: #faf9f7;
        --surface: #ffffff;
        --text: #1f2937;
        --text-muted: #6b7280;
        --border: #e8e4df;
        --success: #22c55e;
        --success-bg: #dcfce7;
        --danger: #ef4444;
        --danger-bg: #fee2e2;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        --shadow-hover: 0 12px 30px rgba(0, 0, 0, 0.12);
        --radius: 20px;
        --radius-sm: 12px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        background: linear-gradient(
          180deg,
          #f8f6f4 0%,
          #f2efe9 50%,
          #f8f6f4 100%
        );
        background-attachment: fixed;
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--surface);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      .nav-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 24px;
        font-weight: 900;
        color: var(--primary);
        letter-spacing: -0.5px;
        text-decoration: none;
      }
      .logo-icon {
        width: 32px;
        height: 32px;
        background: var(--primary);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 24px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
      }
      .nav-links a {
        color: inherit;
        text-decoration: none;
        transition: color 0.2s;
      }
      .nav-links a:hover {
        color: var(--primary);
      }

      .hero {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: white;
        padding: 64px 24px;
        text-align: center;
      }
      .hero h1 {
        font-size: clamp(32px, 5vw, 48px);
        font-weight: 900;
        margin-bottom: 12px;
        letter-spacing: -1px;
      }
      .hero p {
        font-size: clamp(16px, 2vw, 20px);
        opacity: 0.95;
        max-width: 640px;
        margin: 0 auto;
      }

      .filters {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 20px 24px;
        position: sticky;
        top: 64px;
        z-index: 90;
      }
      .filter-container {
        max-width: 1280px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr auto auto auto auto;
        gap: 12px;
        align-items: center;
      }
      .filter-input,
      .filter-select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 14px;
        background: var(--bg);
        color: var(--text);
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .filter-input:focus,
      .filter-select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(255, 77, 77, 0.12);
      }
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--bg);
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .toggle input {
        display: none;
      }
      .toggle-check {
        width: 36px;
        height: 20px;
        background: #d1d5db;
        border-radius: 999px;
        position: relative;
        transition: background 0.2s;
      }
      .toggle-check::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .toggle input:checked + .toggle-check {
        background: var(--success);
      }
      .toggle input:checked + .toggle-check::after {
        transform: translateX(16px);
      }

      @media (max-width: 900px) {
        .filter-container {
          grid-template-columns: 1fr 1fr;
        }
        .filter-container .search-wrapper {
          grid-column: 1 / -1;
        }
      }
      @media (max-width: 480px) {
        .filter-container {
          grid-template-columns: 1fr;
        }
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 40px 24px;
      }

      .restaurant-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 32px 24px;
      }

      .card {
        background: transparent;
        border-radius: var(--radius);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        cursor: pointer;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .card:hover .card-image img {
        transform: scale(1.06);
      }
      .card:hover .card-title {
        color: var(--primary);
      }

      .card-image {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        border-radius: var(--radius);
        overflow: hidden;
        background: #eee;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }
      .card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
      }
      .image-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.75) 0%,
          rgba(0, 0, 0, 0.15) 40%,
          transparent 65%
        );
        pointer-events: none;
      }
      .promo-overlay {
        position: absolute;
        left: 16px;
        bottom: 14px;
        right: 16px;
        color: white;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: -0.3px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        line-height: 1.1;
      }
      .top-chain-badge {
        position: absolute;
        top: 14px;
        left: 14px;
        background: rgba(255, 255, 255, 0.95);
        color: #4a2c00;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .fav-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-muted);
        transition:
          color 0.2s,
          transform 0.2s;
      }
      .fav-btn:hover {
        color: var(--primary);
        transform: scale(1.1);
      }
      .status-pill {
        position: absolute;
        bottom: 14px;
        right: 14px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .status-open {
        background: rgba(34, 197, 94, 0.95);
        color: white;
      }
      .status-closed {
        background: rgba(239, 68, 68, 0.95);
        color: white;
      }

      .card-body {
        padding: 16px 4px 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .card-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.3px;
        transition: color 0.2s;
        line-height: 1.2;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rating-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--success);
        color: white;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .rating-chip svg {
        width: 12px;
        height: 12px;
      }
      .cuisine-line,
      .location-line {
        color: var(--text-muted);
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta-dot {
        margin: 0 6px;
        opacity: 0.6;
      }

      .card-actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        padding-top: 14px;
        border-top: 1px dashed var(--border);
        align-items: center;
        justify-content: space-between;
      }
      .price-hint {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 600;
      }
      .price-hint strong {
        color: var(--text);
        font-weight: 800;
      }
      .order-btn {
        padding: 9px 18px;
        border-radius: 999px;
        border: none;
        background: var(--text);
        color: white;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
      }
      .order-btn:hover:not(:disabled) {
        background: var(--primary);
      }
      .order-btn:active {
        transform: scale(0.97);
      }
      .order-btn:disabled {
        background: #e5e7eb;
        color: #9ca3af;
        cursor: not-allowed;
      }

      .no-results {
        grid-column: 1 / -1;
        text-align: center;
        padding: 80px 24px;
        color: var(--text-muted);
        font-size: 16px;
      }

      .footer {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        padding: 40px 24px;
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        margin-top: 48px;
      }

      @media (max-width: 480px) {
        .card-title {
          font-size: 16px;
        }
        .promo-overlay {
          font-size: 18px;
        }
      }
    </style>
  </head>

      const heartIcon =
        '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

      function createCard(r) {
        const topChainBadge = r.topChain
          ? `<span class="top-chain-badge">${crownIcon} Top Chain</span>`
          : "";
        const statusClass = r.isActive ? "status-open" : "status-closed";
        const statusText = r.isActive ? "● Open" : "● Closed";
        const btnDisabled = r.isActive ? "" : "disabled";
        const btnText = r.isActive ? "Order Now" : "Closed";

        return `
        <article class="card" role="listitem" title="${r.restaurantName} — ${r.address}, ${r.phoneNumber}, ${r.email}, ${r.openingTime}-${r.closingTime}">
          <div class="card-image">
            <img src="${r.image}" alt="${r.restaurantName} - ${r.cuisineType}" loading="lazy" />
            <div class="image-overlay"></div>
            ${topChainBadge}
            <button class="fav-btn" aria-label="Add to favorites">${heartIcon}</button>
            <span class="status-pill ${statusClass}">${statusText}</span>
            <div class="promo-overlay">${r.promoOffer}</div>
          </div>
          <div class="card-body">
            <div class="card-title-row">
              <h2 class="card-title">${r.restaurantName}</h2>
              <span class="rating-chip">${starIcon} ${r.rating.toFixed(1)}</span>
            </div>
            <div class="cuisine-line">${r.cuisineType}<span class="meta-dot">•</span>${r.deliveryTimeMin}-${r.deliveryTimeMax} min</div>
            <div class="location-line">${r.location} <span class="meta-dot">•</span> ${r.openingTime} – ${r.closingTime}</div>
            <div class="card-actions">
              <span class="price-hint"><strong>₹${r.priceForOne}</strong> for one</span>
              <button class="order-btn" ${btnDisabled}>${btnText}</button>
            </div>
          </div>
        </article>
      `;
      }

      function renderCards(data) {
        const grid = document.getElementById("restaurantGrid");
        if (data.length === 0) {
          grid.innerHTML =
            '<div class="no-results">No restaurants match your search.</div>';
          return;
        }
        grid.innerHTML = data.map((r, i) => createCard(r, i)).join("");
      }

      function populateCuisineFilter() {
        const cuisines = new Set();
        restaurants.forEach((r) => {
          r.cuisineType.split(",").forEach((c) => cuisines.add(c.trim()));
        });
        const select = document.getElementById("cuisineFilter");
        const sorted = Array.from(cuisines).sort();
        sorted.forEach((c) => {
          const option = document.createElement("option");
          option.value = c;
          option.textContent = c;
          select.appendChild(option);
        });
      }

      function filterAndSort() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const cuisine = document.getElementById("cuisineFilter").value;
        const openOnly = document.getElementById("openToggle").checked;
        const sort = document.getElementById("sortSelect").value;

        let filtered = restaurants.filter((r) => {
          const matchesSearch =
            r.restaurantName.toLowerCase().includes(search) ||
            r.cuisineType.toLowerCase().includes(search) ||
            r.location.toLowerCase().includes(search) ||
            r.address.toLowerCase().includes(search);
          const matchesCuisine =
            !cuisine ||
            r.cuisineType.toLowerCase().includes(cuisine.toLowerCase());
          const matchesOpen = !openOnly || r.isActive;
          return matchesSearch && matchesCuisine && matchesOpen;
        });

        if (sort === "rating-desc") {
          filtered.sort((a, b) => b.rating - a.rating);
        } else if (sort === "delivery-asc") {
          filtered.sort((a, b) => a.deliveryTimeMin - b.deliveryTimeMin);
        } else if (sort === "name-asc") {
          filtered.sort((a, b) =>
            a.restaurantName.localeCompare(b.restaurantName),
          );
        }

        renderCards(filtered);
      }

      document
        .getElementById("searchInput")
        .addEventListener("input", filterAndSort);
      document
        .getElementById("cuisineFilter")
        .addEventListener("change", filterAndSort);
      document
        .getElementById("openToggle")
        .addEventListener("change", filterAndSort);
      document
        .getElementById("sortSelect")
        .addEventListener("change", filterAndSort);

      populateCuisineFilter();
      renderCards(restaurants);
    </script>
  </body>
