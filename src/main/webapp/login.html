<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · SwiftByte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Warm sunset — appetite / craving palette */
        --brand-red: #ff3d68;
        --brand-orange: #ff8a3d;
        --brand-amber: #ffd28a;
        --brand-red-deep: #d91a4a;
        --gradient-brand: linear-gradient(135deg, #ff3d68 0%, #ff8a3d 100%);
        --gradient-bg: linear-gradient(
          135deg,
          #ff3d68 0%,
          #ff7a45 40%,
          #ffaa5c 70%,
          #ffd28a 100%
        );

        --card: #ffffff;
        --text: #2b1a1a;
        --muted: #9a8a82;
        --input-bg: #fff8f4;
        --input-line: #f3ddd2;
        --shadow-card:
          0 30px 80px rgba(255, 61, 104, 0.26), 0 10px 30px rgba(0, 0, 0, 0.08);
        --shadow-btn: 0 12px 28px rgba(255, 61, 104, 0.42);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Poppins", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--gradient-bg);
        padding: 24px;
        color: var(--text);
        overflow-x: hidden;
        position: relative;
      }

      /* soft ambient blobs */
      body::before,
      body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.55;
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        width: 420px;
        height: 420px;
        background: #ff3d68;
        top: -120px;
        left: -120px;
      }
      body::after {
        width: 480px;
        height: 480px;
        background: #ffd28a;
        bottom: -160px;
        right: -140px;
      }

      .login-card {
        position: relative;
        z-index: 1;
        display: flex;
        width: 100%;
        max-width: 960px;
        min-height: 580px;
        background: var(--card);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: var(--shadow-card);
        animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* ---------- Left visual ---------- */
      .visual {
        position: relative;
        flex: 1.05;
        min-width: 320px;
        background: url("https://images.unsplash.com/photo-1565299624946-b28f40a3ae07?ixlib=rb-4.0.3&auto=format&fit=crop&w=900&q=80")
          center/cover no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 36px;
        color: #fff;
      }
      .visual::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            180deg,
            rgba(0, 0, 0, 0) 0%,
            rgba(0, 0, 0, 0.55) 100%
          ),
          linear-gradient(
            135deg,
            rgba(255, 61, 104, 0.55),
            rgba(255, 138, 61, 0.35)
          );
      }

      .brand {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: 0.2px;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--gradient-brand);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      }
      .brand-mark svg {
        width: 18px;
        height: 18px;
      }

      .visual-content {
        position: relative;
        z-index: 1;
      }
      .visual-content h2 {
        font-size: 2.1rem;
        font-weight: 700;
        line-height: 1.15;
        margin-bottom: 10px;
      }
      .visual-content p {
        font-size: 0.95rem;
        font-weight: 300;
        line-height: 1.55;
        opacity: 0.92;
        max-width: 320px;
      }
      .dots {
        display: flex;
        gap: 8px;
        margin-top: 22px;
      }
      .dot {
        width: 22px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.4);
        transition:
          background 0.3s,
          width 0.3s;
      }
      .dot.active {
        background: #fff;
        width: 30px;
      }

      /* ---------- Right form ---------- */
      .form-section {
        flex: 1;
        min-width: 320px;
        padding: 56px 52px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .eyebrow {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--brand-red);
        margin-bottom: 10px;
      }
      .form-section h1 {
        font-size: 1.9rem;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .subtitle {
        font-size: 0.92rem;
        color: var(--muted);
        margin-bottom: 30px;
      }

      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        font-size: 0.78rem;
        font-weight: 500;
        color: #52525b;
        margin-bottom: 8px;
      }
      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
        background: var(--input-bg);
        border: 1.5px solid var(--input-line);
        border-radius: 12px;
        padding: 4px 14px;
        transition:
          border-color 0.25s,
          background 0.25s,
          box-shadow 0.25s;
      }
      .input-wrap:focus-within {
        border-color: var(--brand-red);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(255, 90, 78, 0.12);
      }
      .input-wrap svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .input-wrap input {
        width: 100%;
        border: none;
        background: transparent;
        padding: 12px 10px;
        font-size: 0.95rem;
        font-family: inherit;
        color: var(--text);
        outline: none;
      }
      .input-wrap input::placeholder {
        color: #b6b6bf;
      }
      .toggle-pass {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        display: grid;
        place-items: center;
        padding: 4px;
        border-radius: 6px;
      }
      .toggle-pass:hover {
        color: var(--brand-red);
      }

      .options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 6px 0 24px;
        font-size: 0.85rem;
      }
      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #52525b;
        cursor: pointer;
        user-select: none;
      }
      .remember input {
        width: 16px;
        height: 16px;
        accent-color: var(--brand-red);
        cursor: pointer;
      }
      .forgot {
        color: var(--brand-red);
        text-decoration: none;
        font-weight: 600;
      }
      .forgot:hover {
        text-decoration: underline;
      }

      .btn-login {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: var(--gradient-brand);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        box-shadow: var(--shadow-btn);
        transition:
          transform 0.18s ease,
          box-shadow 0.25s ease,
          filter 0.25s ease;
        letter-spacing: 0.2px;
      }
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 34px rgba(255, 90, 78, 0.5);
        filter: brightness(1.03);
      }
      .btn-login:active {
        transform: translateY(0);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0 16px;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--input-line);
      }

      .socials {
        display: flex;
        gap: 10px;
      }
      .social-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px;
        border-radius: 12px;
        border: 1.5px solid var(--input-line);
        background: #fff;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 500;
        color: #3f3f46;
        transition:
          border-color 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
      }
      .social-btn:hover {
        border-color: var(--brand-red);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(255, 90, 78, 0.12);
      }
      .social-btn svg {
        width: 18px;
        height: 18px;
      }

      .signup {
        text-align: center;
        margin-top: 22px;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .signup a {
        color: var(--brand-red);
        text-decoration: none;
        font-weight: 600;
      }
      .signup a:hover {
        text-decoration: underline;
      }

      @media (max-width: 860px) {
        .login-card {
          flex-direction: column;
          max-width: 440px;
          min-height: unset;
        }
        .visual {
          min-height: 220px;
          padding: 24px;
        }
        .visual-content h2 {
          font-size: 1.6rem;
        }
        .form-section {
          padding: 36px 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <!-- Left: brand + food visual -->
      <section class="visual" aria-label="SwiftByte promo">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" fill="#fff" />
            </svg>
          </span>
          SwiftByte
        </div>

        <div class="visual-content">
          <h2>Hungry? We got you.</h2>
          <p>
            AI-powered delivery from top restaurants, chains, and hidden gems
            near you.
          </p>
          <div class="dots" aria-hidden="true">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </section>

      <!-- Right: login form -->
      <section class="form-section">
        <span class="eyebrow">Welcome back</span>
        <h1>Sign in to SwiftByte</h1>
        <p class="subtitle">Order your favorite meals in seconds.</p>

        <form action="#" method="POST" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 4h16v16H4z" />
                <path d="m4 6 8 7 8-7" />
              </svg>
              <input
                id="email"
                type="email"
                name="email"
                placeholder="you@example.com"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="4" y="11" width="16" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 1 1 8 0v4" />
              </svg>
              <input
                id="password"
                type="password"
                name="password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="toggle-pass"
                aria-label="Show password"
                onclick="togglePass(this)"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox" name="remember" />
              Remember me
            </label>
            <a href="#" class="forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn-login">Sign In</button>

          <div class="divider">or continue with</div>

          <div class="socials">
            <button
              type="button"
              class="social-btn"
              aria-label="Continue with Google"
            >
              <svg viewBox="0 0 24 24">
                <path
                  fill="#EA4335"
                  d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.9 3.4 14.7 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12S6.7 21.6 12 21.6c6.9 0 11.5-4.8 11.5-11.6 0-.8-.1-1.4-.2-1.9H12z"
                />
              </svg>
              Google
            </button>
            <button
              type="button"
              class="social-btn"
              aria-label="Continue with Apple"
            >
              <svg viewBox="0 0 24 24" fill="#000">
                <path
                  d="M16.4 12.7c0-2.4 2-3.6 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.6.9-.8 0-1.9-.9-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.1.8c1.3 0 2.1-1.2 2.9-2.4.9-1.3 1.3-2.7 1.3-2.7-.1 0-2.6-1-2.6-3.9zM14.1 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.5-.6.7-1.2 1.9-1 2.9 1.1.1 2.2-.6 2.8-1.4z"
                />
              </svg>
              Apple
            </button>
          </div>
        </form>

        <p class="signup">
          New to SwiftByte? <a href="#">Create an account</a>
        </p>
      </section>
    </main>

    <script>
      function togglePass(btn) {
        const input = btn.parentElement.querySelector("input");
        const isPwd = input.type === "password";
        input.type = isPwd ? "text" : "password";
        btn.setAttribute(
          "aria-label",
          isPwd ? "Hide password" : "Show password",
        );
      }
    </script>
  </body>
</html>
